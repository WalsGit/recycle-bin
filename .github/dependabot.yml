version: 2
updates:
  # Backend: PHP / Composer
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "main"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "chore"
    groups:
      php-dependencies:
        patterns:
          - "*"

  # Frontend: JavaScript / Yarn (package.json lives in js/)
  - package-ecosystem: "npm"
    directory: "/js"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "main"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "chore"
    groups:
      js-dependencies:
        patterns:
          - "*"
